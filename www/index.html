/* ============================================================
   音频引擎（Web Audio 程序化合成，无外部文件）
   ============================================================ */
let AC=null, masterGain=null, sfxOn=true, bgmOn=true, bgmTimer=null, bgmStep=0, lastBounceSnd=0;
function ac(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); masterGain=AC.createGain(); masterGain.gain.value=0.5; masterGain.connect(AC.destination); }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function tone(freq,dur,type="sine",vol=0.3,slideTo=null,delay=0){
  if(!sfxOn) return;
  try{
    const a=ac(); const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur,vol=0.2,delay=0){
  if(!sfxOn) return;
  try{
    const a=ac(); const t=a.currentTime+delay;
    const buf=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=a.createBufferSource(); src.buffer=buf;
    const g=a.createGain(); g.gain.value=vol;
    src.connect(g); g.connect(masterGain); src.start(t);
  }catch(e){}
}
const SFX={
  launch(){ tone(380,0.16,"sine",0.22,950); },
  bounce(){
    const now=performance.now();
    if(now-lastBounceSnd<60) return; // 节流，避免一帧多碰爆音
    lastBounceSnd=now;
    tone(220,0.05,"square",0.08,160);
  },
  hit(){ tone(320,0.09,"triangle",0.25,180); noiseBurst(0.04,0.08); },
  crit(){ tone(160,0.22,"sawtooth",0.3,70); noiseBurst(0.12,0.18); },

const BGM_MELODY = [523,587,659,784,880,784,659,587, 523,587,659,784,880,1047,880,784,

const BGM_BASS = [131,165,196,165, 147,185,220,185];
function startBGM(){
  if(bgmTimer) return;
  bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(!bgmOn||!sfxOn) return;
    // 主旋律（舒缓长音）
    const f=BGM_MELODY[bgmStep%BGM_MELODY.length];
    tone(f,0.6,"sine",0.05);
    if(!PERF_LIGHT) tone(f*2,0.4,"sine",0.02);
    if(bgmStep%4===0){
      const bf=BGM_BASS[(bgmStep/4)%BGM_BASS.length|0];
      tone(bf,1.2,"triangle",0.04);
      if(!PERF_LIGHT) tone(bf*1.5,1.0,"sine",0.02);
    }
    if(!PERF_LIGHT && Math.random()<0.25){
      const drop=[1047,1175,1319,1568][Math.floor(Math.random()*4)];
      tone(drop,0.3,"sine",0.03,null,0);
    }
    bgmStep++;
  },BGM_TICK_MS);
}
function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }

function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio||1, DPR_MAX);
  const scale = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*scale)+'px';

  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function parseWeight(str){
  const out=[]; str.split(';').forEach(s=>{ s=s.trim(); if(!s)return;
    const [id,w]=s.split('_').map(Number); out.push({id,w}); });
  return out;
}
function startLevel(){
  const L = LEVELS[levelIdx];
  fishes=[]; balls=[]; obstacles=[]; particles=[]; floats=[];
  used = ballPool.map(()=>false);
  curBall = firstUnused();
  settleTimer=0;
  // 生成鱼
  const fishCfg = L.fish.split(';').filter(s=>s.trim()).map(s=>{
    const [id,n]=s.split('_').map(Number); return {id,n};
  });
  fishCfg.forEach(cfg=>{
    const def = FISH_DEFS[cfg.id-1];
    for(let i=0;i<cfg.n;i++) spawnFish(def[0], def[1], def[2]);
  });
  // 生成障碍
  for(let i=0;i<L.obs;i++) spawnObstacle();
}
function spawnFish(id, money, hp){
  const r = 46 + (id%5)*4;
  let x,y,tries=0;
  do{
    x = 120+Math.random()*(W-240);
    y = FIELD_TOP+120+Math.random()*(FIELD_BOT-FIELD_TOP-240);
    tries++;
  }while(tries<30 && Math.hypot(x-LAUNCH.x,y-LAUNCH.y) < 220);
  const ang = Math.random()*Math.PI*2;
  const [tMin,tMax] = [20,30];  // 转向频率 20_30（单位10=1秒）
  fishes.push({
    id, x, y, r, hp, maxHp:hp, money,
    vx:Math.cos(ang)*100, vy:Math.sin(ang)*100,
    nextTurn: (tMin+Math.random()*(tMax-tMin))/10,
    poison:0, poisonDps:0, frozen:false, doubleNext:false,
    wobble: Math.random()*Math.PI*2
  });
}
function spawnObstacle(){
  const r = 45+Math.random()*40;
  let x,y,tries=0;
  do{
    x = 100+Math.random()*(W-200);
    y = FIELD_TOP+100+Math.random()*(FIELD_BOT-FIELD_TOP-200);
    tries++;
  }while(tries<40 && (Math.hypot(x-LAUNCH.x,y-LAUNCH.y)<260 ||
       obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<o.r+r+60)));
  obstacles.push({x,y,r, kind: Math.floor(Math.random()*4), seed: Math.random()*10});
}

// 找下一个未发射的球（循环）
function firstUnused(){
  for(let i=0;i<ballPool.length;i++) if(!used[i]) return i;
  return 0;
}
function swapBall(dir){
  const n = ballPool.length;
  for(let step=1; step<=n; step++){
    const idx = ((curBall + dir*step) % n + n) % n;
    if(!used[idx]){ curBall = idx; SFX.swap(); return; }
  }
}
// 右下角左右切换球按钮
const SWAP_LEFT = { x: W-200, y: FIELD_BOT+290, r: 44 };
const SWAP_RIGHT = { x: W-70, y: FIELD_BOT+290, r: 44 };
let recycleBonus=0; // 剩余球回收奖励

/* ============================================================
   弹球发射与物理
   ============================================================ */
function spawnBall(x,y,dx,dy,b){
  balls.push({
    x, y, vx:dx*b.speed, vy:dy*b.speed,
    r:22, atk:b.atk, rebound:b.rebound, effect:b.effect,
    color:b.color, glow:b.glow, trail:[]
  });
}
function launchBall(tx,ty){
  ac(); // 用户手势里初始化音频
  const b = effBall(ballPool[curBall]);
  let dx=tx-LAUNCH.x, dy=ty-LAUNCH.y;
  const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
  spawnBall(LAUNCH.x, LAUNCH.y, dx, dy, b);
  SFX.launch();
  if(b.effect===6){ // 双子球：反方向再发一个同属性球
    spawnBall(LAUNCH.x, LAUNCH.y, -dx, -dy, b);
  }
  used[curBall] = true;
  // 若所有球都已发完，next 指向任意；判断是否还有未发射的
  const hasLeft = ballPool.some((_,i)=>!used[i]);
  if(hasLeft){ curBall = firstUnused(); state = ST.AIM; }
  else { state = ST.PLAY; settleTimer = 0; }
}
function reflect(vx,vy,nx,ny){
  const dot = vx*nx+vy*ny;
  return [vx-2*dot*nx, vy-2*dot*ny];
}
function killFish(f, idx, killer){
  money += f.money + moneyTalent;
  SFX.kill();
  if(killer && killer.effect===9){ SFX.coin(); }
  floats.push({x:f.x, y:f.y, txt:"+"+(f.money+moneyTalent), life:1, color:"#ffd54f"});
  if(killer && killer.effect===9){ // 幸运球：额外+20
    money += 20;
    floats.push({x:f.x, y:f.y-30, txt:"+20 幸运", life:1.1, color:"#ffe57f"});
  }
  for(let i=0;i<14;i++) particles.push({x:f.x,y:f.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.6+Math.random()*.4,c:fishesColor(f.id),r:3+Math.random()*5});
  fishes.splice(idx,1);
  screenShake = Math.max(screenShake, 6);
}
function fishesColor(id){
  const hue = (id*37)%360; return `hsl(${hue},70%,60%)`;
}
function damageFish(f, idx, dmg, killer){
  if(f.hp<=0) return;
  let crit=false;
  if(killer && killer.effect===10 && Math.random()<0.5){ dmg*=2; crit=true; } // 暴击球
  let d = dmg;
  if(f.doubleNext){ d*=2; f.doubleNext=false; f.frozen=false; }
  f.hp -= d;
  if(crit) SFX.crit(); else SFX.hit();
  floats.push({x:f.x, y:f.y-f.r-10, txt:(crit?"暴击 ":"-")+Math.round(d), life:.7, color:crit?"#ff1744":"#ff8a80", small:true});
  if(f.hp<=0){ killFish(f, idx, killer); }
}
function applyBallHit(ball, f, idx){
  const atk = ball.atk;
  // 特效触发（基于被碰撞到的这条鱼）
  if(ball.effect===1){ // 闪电：攻击最近的另外2条鱼
    const others = fishes.map((o,i)=>({o,i})).filter(t=>t.o!==f)
      .sort((a,b)=>Math.hypot(a.o.x-f.x,a.o.y-f.y)-Math.hypot(b.o.x-f.x,b.o.y-f.y))
      .slice(0,2);
    others.forEach(t=>{
      particles.push({x:f.x,y:f.y,vx:(t.o.x-f.x)/3,vy:(t.o.y-f.y)/3,life:.25,c:"#fff176",r:3,lightning:true});
      damageFish(t.o, t.i, atk, ball);
    });
  } else if(ball.effect===2){ // 爆炸 100 范围
    for(let i=fishes.length-1;i>=0;i--){
      const o=fishes[i]; if(o===f) continue;
      if(Math.hypot(o.x-f.x,o.y-f.y)<=100){
        particles.push({x:f.x,y:f.y,vx:(o.x-f.x)/3,vy:(o.y-f.y)/3,life:.3,c:"#ff7043",r:4,lightning:true});
        damageFish(o, i, atk, ball);
      }
    }
    for(let i=0;i<20;i++) particles.push({x:f.x,y:f.y,vx:Math.cos(i/20*6.28)*200,vy:Math.sin(i/20*6.28)*200,life:.4,c:"#ffab40",r:4});
  } else if(ball.effect===3){ // 中毒
    f.poison = 5; f.poisonDps = atk/2;
  } else if(ball.effect===4){ // 冰冻
    f.frozen = true; f.doubleNext = true;
  }
  // 对主鱼造成伤害
  damageFish(f, idx, atk, ball);
}

/* ============================================================
   主更新
   ============================================================ */
function update(dt){
  // 背景气泡
  bubbles.forEach(b=>{ b.y-=b.s*dt; if(b.y< -20){ b.y=H+20; b.x=Math.random()*W; } });
  // 浮游颗粒缓慢上浮+横向漂移
  plankton.forEach(p=>{
    p.y-=p.s*dt; p.ph+=dt;
    p.x+=Math.sin(p.ph)*p.dr;
    if(p.y<FIELD_TOP-10){ p.y=FIELD_BOT+10; p.x=Math.random()*W; }
  });
  // 粒子 / 飘字
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0)particles.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.y-=50*dt; f.life-=dt*1.3; if(f.life<=0)floats.splice(i,1); }
  if(screenShake>0) screenShake = Math.max(0, screenShake-dt*30);

  if(state===ST.AIM || state===ST.PLAY){
    // 鱼移动
    fishes.forEach(f=>{
      if(f.frozen) return;
      f.wobble += dt*3;
      f.x += f.vx*dt; f.y += f.vy*dt;
      f.nextTurn -= dt;
      if(f.nextTurn<=0){
        const [tMin,tMax]=[20,30];
        f.nextTurn = (tMin+Math.random()*(tMax-tMin))/10;
        const cur = Math.atan2(f.vy,f.vx);
        const delta = (Math.PI/6 + Math.random()*(Math.PI-Math.PI/6)) * (Math.random()<.5?-1:1);
        const nAng = cur+delta;
        const sp = Math.hypot(f.vx,f.vy);
        f.vx = Math.cos(nAng)*sp; f.vy = Math.sin(nAng)*sp;
      }
      // 鱼碰墙反弹
      if(f.x<f.r){ f.x=f.r; f.vx=Math.abs(f.vx); }
      if(f.x>W-f.r){ f.x=W-f.r; f.vx=-Math.abs(f.vx); }
      if(f.y<FIELD_TOP+f.r){ f.y=FIELD_TOP+f.r; f.vy=Math.abs(f.vy); }
      if(f.y>FIELD_BOT-f.r){ f.y=FIELD_BOT-f.r; f.vy=-Math.abs(f.vy); }
      // 鱼碰障碍反弹
      obstacles.forEach(o=>{
        const dx=f.x-o.x, dy=f.y-o.y, d=Math.hypot(dx,dy), min=f.r+o.r;
        if(d<min && d>0){
          const nx=dx/d, ny=dy/d;
          f.x=o.x+nx*min; f.y=o.y+ny*min;
          const [rvx,rvy]=reflect(f.vx,f.vy,nx,ny); f.vx=rvx; f.vy=rvy;
        }
      });
      // 中毒 DOT
      if(f.poison>0){
        f.poison-=dt;
        f._dotAcc=(f._dotAcc||0)+dt;
        if(f._dotAcc>=1){
          f._dotAcc-=1;
          f.hp-=f.poisonDps;
          floats.push({x:f.x,y:f.y-f.r-10,txt:"-"+Math.round(f.poisonDps),life:.6,color:"#9ccc65",small:true});
        }
      }
    });
    // 处理中毒/持续伤害死亡的鱼
    for(let i=fishes.length-1;i>=0;i--){
      if(fishes[i].hp<=0){ killFish(fishes[i], i, null); }
    }
    // 球移动与碰撞
    for(let i=balls.length-1;i>=0;i--){
      const b=balls[i];
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length>BALL_TRAIL_MAX)b.trail.shift();
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      // 边界
      if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx); b.rebound--; onBounce(b); }
      if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx); b.rebound--; onBounce(b); }
      if(b.y<FIELD_TOP+b.r){ b.y=FIELD_TOP+b.r; b.vy=Math.abs(b.vy); b.rebound--; onBounce(b); }
      if(b.y>FIELD_BOT-b.r){ b.y=FIELD_BOT-b.r; b.vy=-Math.abs(b.vy); b.rebound--; onBounce(b); }
      // 障碍
      obstacles.forEach(o=>{
        const dx=b.x-o.x, dy=b.y-o.y, d=Math.hypot(dx,dy), min=b.r+o.r;
        if(d<min && d>0){
          const nx=dx/d, ny=dy/d;
          b.x=o.x+nx*min; b.y=o.y+ny*min;
          const [rvx,rvy]=reflect(b.vx,b.vy,nx,ny); b.vx=rvx; b.vy=rvy;
          if(b.effect!==7) b.rebound--; // 避障球：碰障碍不消耗次数
          onBounce(b);
        }
      });
      // 鱼
      for(let fi=fishes.length-1; fi>=0; fi--){
        const f=fishes[fi];
        const dx=b.x-f.x, dy=b.y-f.y, d=Math.hypot(dx,dy), min=b.r+f.r;
        if(d<min){
          applyBallHit(b, f, fi);
          if(b.effect===5){
            // 穿透球：碰鱼不反弹，但仍消耗弹射次数
            b.rebound--;
            // 沿穿透方向略微推开避免连续触发同一帧
            const nx=dx/(d||1), ny=dy/(d||1);
            b.x=f.x+nx*min; b.y=f.y+ny*min;
          } else {
            const nx=dx/(d||1), ny=dy/(d||1);
            b.x=f.x+nx*min; b.y=f.y+ny*min;
            const [rvx,rvy]=reflect(b.vx,b.vy,nx,ny); b.vx=rvx; b.vy=rvy;
            b.rebound--; onBounce(b);
          }
          break; // 一帧只处理一条鱼
        }
      }
      if(b.rebound<=0){
        // 分裂球：次数耗尽时向间隔120度的3个方向各发射一个基础球
        if(b.effect===8){
          const base = effBall(1);
          const baseAng = Math.random()*Math.PI*2;
          for(let k=0;k<3;k++){
            const a = baseAng + k*(Math.PI*2/3);
            spawnBall(b.x, b.y, Math.cos(a), Math.sin(a), base);
          }
          SFX.split();
          for(let k=0;k<16;k++) particles.push({x:b.x,y:b.y,vx:Math.cos(k/16*6.28)*200,vy:Math.sin(k/16*6.28)*200,life:.5,c:b.glow,r:3});
        } else {
          for(let k=0;k<10;k++) particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.4,c:b.glow,r:3});
        }
        balls.splice(i,1);
      }
    }
    if(state===ST.PLAY && settleTimer>0) settleTimer -= dt;
  }
  if(state===ST.AIM || state===ST.PLAY) checkRoundEnd();
}
function checkRoundEnd(){
  if(state!==ST.AIM && state!==ST.PLAY) return;
  if(fishes.length===0){
    const unused = ballPool.filter((_,i)=>!used[i]).length;
    if(unused>0){
      recycleBonus = unused*50;
      money += recycleBonus;
    } else {
      recycleBonus = 0;
    }
    showSettle();
    return;
  }
  if(state===ST.PLAY && balls.length===0){
    recycleBonus = 0;
    showSettle();
  }
}
function forceSettleNow(){
  if(state!==ST.PLAY && state!==ST.AIM) return;
  balls.length = 0;
  particles.length = 0;
  settleTimer = 0;
  const unused = ballPool.filter((_,i)=>!used[i]).length;
  if(unused>0){
    recycleBonus = unused*50;
    money += recycleBonus;
  } else {
    recycleBonus = 0;
  }
  showSettle();
}
function catchUpSimulation(seconds){
  let budget = Math.min(Math.max(0, seconds), 5);
  const step = 0.032;
  let guard = 0;
  while(budget > 0.001 && guard++ < 400){
    if(state!==ST.AIM && state!==ST.PLAY) break;
    const dt = Math.min(step, budget);
    update(dt);
    budget -= dt;
  }
}
function onBounce(b){
  SFX.bounce();
  particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.25,c:b.glow,r:2});
}

/* ============================================================
   结算 / 奖励
   ============================================================ */
function showSettle(){
  const target = LEVELS[levelIdx].target;
  if(money >= target){
    state = ST.REWARD;
    rewardPicks = rollRewards();
    SFX.reward();
  } else {
    state = ST.OVER;
    SFX.lose();
    earnExp();
  }
}
let lastEarnedExp=0;
function earnExp(){
  // 每通过1小关=1经验；通过关数=levelIdx（0-based）
  const earned = levelIdx;
  lastEarnedExp = earned;
  if(earned>0){
    totalExp += earned;
    saveSave();
  }
}
function rollRewards(){
  const L = LEVELS[levelIdx];
  const bp = parseWeight(L.ball).map(x=>({type:"ball", id:x.id, w:x.w}));
  const ep = parseWeight(L.eff).map(x=>({type:"eff", id:x.id, w:x.w}));
  const pool = bp.concat(ep);
  const picks=[];
  for(let k=0;k<3;k++){
    const total = pool.reduce((s,p)=>s+p.w,0);
    let r = Math.random()*total, chosen=null;
    for(let i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0){ chosen=i; break; } }
    if(chosen===null) chosen=pool.length-1;
    picks.push(pool.splice(chosen,1)[0]);
  }
  return picks;
}
function applyPick(p){
  SFX.reward();
  if(p.type==="ball"){ ballPool.push(p.id); }
  else { const e=EFFECTS[p.id]; gBonus.atk+=e.atk; gBonus.rebound+=e.rebound; gBonus.speed+=e.speed; }
  levelIdx++;
  if(levelIdx>=LEVELS.length){ state=ST.WIN; SFX.win(); earnExp(); return; }
  startLevel(); state=ST.AIM;
}

/* ============================================================
   输入
   ============================================================ */
function toLogic(cx,cy){
  const rect = canvas.getBoundingClientRect();
  return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
}
let pressing=false;
canvas.addEventListener('pointerdown', e=>{
  const p=toLogic(e.clientX,e.clientY);
  // 静音开关（任何状态都能点）
  if(Math.hypot(p.x-MUTE_BTN.x, p.y-MUTE_BTN.y) < MUTE_BTN.r+8){
    sfxOn=!sfxOn; bgmOn=sfxOn;
    if(!sfxOn) stopBGM();
    return;
  }
  if(state===ST.MENU){
    if(ageTipOpen){
      if(hitAgeTipClose(p)){ ageTipOpen=false; markAgeTipSeen(); }
      return;
    }
    if(hitAgeBadge(p)){ ageTipOpen=true; return; }
    if(hitPrivacyBtn(p)){ openPrivacyPolicy(); return; }
    // 开始按钮
    if(p.y>1380 && p.y<1530 && p.x>W/2-220 && p.x<W/2+220){ restartGame(); return; }
    // 天赋按钮
    if(p.y>1580 && p.y<1710 && p.x>W/2-220 && p.x<W/2+220){
      state=ST.TALENT;
      talentScroll = TALENT_STEP*100 - 1650; // 自动定位到最底部起点
      return;
    }
    return;
  }
  if(state===ST.TALENT){
    // 返回按钮
    if(p.x>TALENT_BACK_BTN.x && p.x<TALENT_BACK_BTN.x+TALENT_BACK_BTN.w &&
       p.y>TALENT_BACK_BTN.y && p.y<TALENT_BACK_BTN.y+TALENT_BACK_BTN.h){
      state=ST.MENU; return;
    }
    // 解锁按钮
    if(talentUnlocked<TALENTS.length &&
       p.x>TALENT_UNLOCK_BTN.x && p.x<TALENT_UNLOCK_BTN.x+TALENT_UNLOCK_BTN.w &&
       p.y>TALENT_UNLOCK_BTN.y && p.y<TALENT_UNLOCK_BTN.y+TALENT_UNLOCK_BTN.h){
      const next=TALENTS[talentUnlocked];
      if(totalExp>=next.exp){ totalExp-=next.exp; talentUnlocked++; saveSave(); SFX.reward(); }
      return;
    }
    // 记录拖动起点
    talentDrag = { x:p.x, y:p.y, scroll:talentScroll, moved:false };
    return;
  }
  if(state===ST.OVER || state===ST.WIN){
    // 重新开始
    if(p.y>1450 && p.y<1580 && p.x>W/2-220 && p.x<W/2+220){ restartGame(); }
    // 回到主菜单
    if(p.y>1620 && p.y<1750 && p.x>W/2-220 && p.x<W/2+220){ state=ST.MENU; stopBGM(); }
    return;
  }
  if(state===ST.PLAY && hitForceSettle(p)){ forceSettleNow(); return; }
  if(state===ST.REWARD){
    // 三张卡片
    for(let i=0;i<3;i++){
      const cy = 520+i*420;
      if(p.x>80 && p.x<W-80 && p.y>cy-170 && p.y<cy+170){ applyPick(rewardPicks[i]); break; }
    }
    return;
  }
  if(state===ST.AIM){
    // 右下角左右切换球按钮
    if(Math.hypot(p.x-SWAP_LEFT.x, p.y-SWAP_LEFT.y) < SWAP_LEFT.r+12){ swapBall(-1); return; }
    if(Math.hypot(p.x-SWAP_RIGHT.x, p.y-SWAP_RIGHT.y) < SWAP_RIGHT.r+12){ swapBall(1); return; }
    pressing=true; aim=p; canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointermove', e=>{
  if(pressing && state===ST.AIM) aim=toLogic(e.clientX,e.clientY);
  if(state===ST.TALENT && talentDrag){
    const p=toLogic(e.clientX,e.clientY);
    const dy = p.y - talentDrag.y;
    if(Math.abs(dy)>8) talentDrag.moved=true;
    if(talentDrag.moved){
      talentScroll = talentDrag.scroll - dy;
      if(talentScroll<0) talentScroll=0;
      if(talentScroll>TALENT_MAX_SCROLL) talentScroll=TALENT_MAX_SCROLL;
    }
  }
});
function releasePointers(){
  pressing=false;
  talentDrag=null;
}
canvas.addEventListener('pointerup', e=>{
  if(pressing && state===ST.AIM && aim){
    if(Math.hypot(aim.x-LAUNCH.x, aim.y-LAUNCH.y)>60) launchBall(aim.x, aim.y);
  }
  releasePointers();
});
canvas.addEventListener('pointercancel', releasePointers);
function restartGame(){
  ac(); startBGM();
  const tb=talentBonus();
  levelIdx=0; ballPool=[1,1,1,1]; gBonus={atk:tb.atk, rebound:tb.rebound, speed:tb.speed}; moneyTalent=tb.money; money=0;

function drawBackground(){
  const liteBg = PERF_LIGHT && (state===ST.PLAY || state===ST.AIM);
  if(liteBg){
    ctx.fillStyle="#0b3d70";
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(180,225,255,.14)";
    bubbles.forEach(b=>{
      if(b.y>=FIELD_TOP-40 && b.y<=FIELD_BOT+40){
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.stroke();
      }
    });
    return;
  }
  // 1. 电影级垂直渐变：表层青 → 中层蓝 → 深渊墨蓝
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1b6fae");
  g.addColorStop(0.18,"#125a96");
  g.addColorStop(0.45,"#0b3d70");
  g.addColorStop(0.75,"#062549");
  g.addColorStop(1,"#020d24");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const t = performance.now()/1000;

  // 2. 丁达尔光柱（god rays）：从水面斜射，随时间轻微摆动
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const rayCount = PERF_LIGHT ? 3 : 6;
  for(let i=0;i<rayCount;i++){
    const bx = ((i/rayCount)*W + Math.sin(t*0.25+i*1.7)*90 + W)%(W+400)-200;
    const sway = Math.sin(t*0.4+i)*30;
    const topW = 60+Math.sin(t*0.6+i*2)*30;
    const grad = ctx.createLinearGradient(0,0,0,FIELD_BOT);
    grad.addColorStop(0,"rgba(160,225,255,0.20)");
    grad.addColorStop(0.6,"rgba(120,200,255,0.06)");
    grad.addColorStop(1,"rgba(120,200,255,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(bx-topW/2, 0);
    ctx.lineTo(bx+topW/2, 0);
    ctx.lineTo(bx+topW/2+180+sway, FIELD_BOT);
    ctx.lineTo(bx-topW/2+80+sway, FIELD_BOT);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 3. 海床剪影（底部沙丘 + 珊瑚/海草）
  ctx.save();
  // 沙丘
  ctx.fillStyle="#041a36";
  ctx.beginPath();
  ctx.moveTo(0, FIELD_BOT);
  for(let x=0;x<=W;x+=40){
    const y = FIELD_BOT - 40 - Math.sin(x*0.012)*30 - Math.sin(x*0.03)*12;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, FIELD_BOT); ctx.closePath(); ctx.fill();
  // 珊瑚/海草剪影（固定位置，轻微摇摆）
  ctx.fillStyle="rgba(6,35,66,0.9)";
  const coralCount = PERF_LIGHT ? 5 : 9;
  for(let i=0;i<coralCount;i++){
    const cx = (i*137+80)%W;
    const baseY = FIELD_BOT - 20 - Math.sin(cx*0.012)*30;
    const h = 60+((i*53)%90);
    const sway = Math.sin(t*1.2+i)*6;
    ctx.beginPath();
    ctx.moveTo(cx-10, baseY);
    ctx.quadraticCurveTo(cx-10+sway, baseY-h*0.6, cx+sway, baseY-h);
    ctx.quadraticCurveTo(cx+10+sway, baseY-h*0.6, cx+10, baseY);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 4. 浮游颗粒（marine snow）
  ctx.fillStyle="rgba(200,235,255,0.35)";
  plankton.forEach(p=>{
    ctx.globalAlpha = 0.15 + 0.25*Math.abs(Math.sin(p.ph));
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
  });
  ctx.globalAlpha=1;

  // 5. 气泡
  ctx.strokeStyle="rgba(180,225,255,.22)";
  bubbles.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.stroke(); });

  if(!PERF_LIGHT){
    const vg = ctx.createRadialGradient(W/2,H/2, H*0.3, W/2,H/2, H*0.75);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,"rgba(0,5,20,0.55)");
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
}
function drawFishHud(f){
  const bw=f.r*2, bh=8, bx=f.x-bw/2, by=f.y-f.r-22;
  ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle = f.hp/f.maxHp>0.4?"#69f0ae":"#ff5252";
  ctx.fillRect(bx,by,bw*Math.max(0,f.hp/f.maxHp),bh);
  ctx.fillStyle="#ffd54f"; ctx.font="bold 22px sans-serif"; ctx.textAlign="center";
  ctx.fillText("$"+f.money, f.x, by+bh+20);
}

    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.62,0,0,6.28); ctx.fill();
    ctx.fillStyle=`hsl(${hue},62%,42%)`;

  // 状态效果
  if(f.poison>0){ ctx.fillStyle="rgba(120,200,60,.35)"; ctx.beginPath(); ctx.arc(0,0,f.r*1.1,0,6.28); ctx.fill(); }

function drawObstacle(o){
  const r=o.r, t=performance.now()/1000;
  if(o.kind===0){ // 礁石：不规则岩石
    ctx.fillStyle="#3d4f66";
    ctx.beginPath();
    const pts=8;
    for(let i=0;i<=pts;i++){
      const a=i/pts*Math.PI*2;
      const rr=r*(0.82+0.16*Math.abs(Math.sin(i*3.3+o.seed)));
      const px=o.x+Math.cos(a)*rr, py=o.y+Math.sin(a)*rr*0.92;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.14)";
    ctx.beginPath(); ctx.ellipse(o.x-r*0.18,o.y-r*0.28,r*0.42,r*0.2,-0.4,0,6.28); ctx.fill();
  } else if(o.kind===1){ // 枝珊瑚
    const cols=["#ff8a80","#ffab91","#ce93d8","#90caf9","#f48fb1"];
    ctx.strokeStyle=cols[Math.floor(o.seed)%cols.length];
    ctx.lineCap="round";
    for(let b=-1;b<=1;b++){
      const bx=o.x+b*r*0.3;
      const sway=Math.sin(t*1.4+b+o.seed)*r*0.06;
      ctx.lineWidth=r*0.16;
      ctx.beginPath();
      ctx.moveTo(bx, o.y+r*0.7);
      ctx.quadraticCurveTo(bx+sway, o.y, o.x+b*r*0.4+sway, o.y-r*0.7);
      ctx.stroke();
    }
    // 顶部小珊瑚头
    ctx.fillStyle=cols[Math.floor(o.seed)%cols.length];
    for(let b=-1;b<=1;b++){
      ctx.beginPath(); ctx.arc(o.x+b*r*0.4, o.y-r*0.7, r*0.12, 0, 6.28); ctx.fill();
    }
  } else if(o.kind===2){ // 海草簇
    ctx.strokeStyle="#2e8b6a"; ctx.lineCap="round";
    for(let b=-2;b<=2;b++){
      const bx=o.x+b*r*0.22;
      const sway=Math.sin(t*1.8+b*0.7+o.seed)*r*0.12;
      ctx.lineWidth=r*0.1;
      ctx.beginPath();
      ctx.moveTo(bx, o.y+r*0.7);
      ctx.quadraticCurveTo(bx+sway, o.y-r*0.1, bx+b*r*0.12+sway, o.y-r*0.75);
      ctx.stroke();
    }
  } else { // 圆石 + 贝壳
    ctx.fillStyle="#546e7a";
    ctx.beginPath(); ctx.arc(o.x, o.y, r*0.82, 0, 6.28); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.1)";
    ctx.beginPath(); ctx.arc(o.x-r*0.2,o.y-r*0.25,r*0.3,0,6.28); ctx.fill();
    ctx.fillStyle="#ffe0b2";
    ctx.beginPath(); ctx.arc(o.x+r*0.25,o.y-r*0.15,r*0.32, Math.PI, 0); ctx.fill();
    ctx.strokeStyle="rgba(180,120,80,.6)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(o.x+r*0.25,o.y-r*0.15,r*0.32, Math.PI, 0); ctx.stroke();
  }
}

    roundRect(TALENT_UNLOCK_BTN.x, TALENT_UNLOCK_BTN.y, TALENT_UNLOCK_BTN.w, TALENT_UNLOCK_BTN.h, 28); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="bold 42px sans-serif";
    ctx.fillText(canUnlock ? "解锁" : "经验不足", W/2, TALENT_UNLOCK_BTN.y+66);
  } else {
    ctx.fillStyle="#ffd54f"; ctx.font="bold 36px sans-serif";
    ctx.fillText("天赋已满级！", W/2, TALENT_UNLOCK_BTN.y+60);
  }
  // 返回按钮（海洋风格）
  const grad2 = ctx.createLinearGradient(TALENT_BACK_BTN.x, TALENT_BACK_BTN.y, TALENT_BACK_BTN.x, TALENT_BACK_BTN.y+TALENT_BACK_BTN.h);
  grad2.addColorStop(0,"#5c6bc0"); grad2.addColorStop(1,"#283593");
  ctx.fillStyle=grad2;
  roundRect(TALENT_BACK_BTN.x, TALENT_BACK_BTN.y, TALENT_BACK_BTN.w, TALENT_BACK_BTN.h, 24); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=2;
  roundRect(TALENT_BACK_BTN.x, TALENT_BACK_BTN.y, TALENT_BACK_BTN.w, TALENT_BACK_BTN.h, 24); ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="bold 34px sans-serif";
  ctx.fillText("返回主菜单", W/2, TALENT_BACK_BTN.y+50);
  // 拖动提示
  ctx.fillStyle="rgba(255,255,255,.35)"; ctx.font="22px sans-serif";
  ctx.fillText("↑ 上下拖动查看天赋树 ↓", W/2, 1980);
}
function drawReward(){
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#ffd54f"; ctx.font="bold 60px sans-serif";
  ctx.fillText("过关！选择一项奖励", W/2, 240);
  ctx.fillStyle="#fff"; ctx.font="32px sans-serif";
  ctx.fillText("当前金钱: "+money, W/2, 310);
  if(recycleBonus>0){
    ctx.fillStyle="#a5d6a7"; ctx.font="30px sans-serif";
    ctx.fillText("回收剩余球 +"+recycleBonus+" 金钱", W/2, 360);
  }
  rewardPicks.forEach((p,i)=>{
    const cy=520+i*420;
    ctx.fillStyle="rgba(20,50,100,.95)"; roundRect(80,cy-170,W-160,340,30); ctx.fill();
    ctx.strokeStyle="#4fc3f7"; ctx.lineWidth=3; roundRect(80,cy-170,W-160,340,30); ctx.stroke();
    if(p.type==="ball"){
      const bd=BALLS[p.id];
      setBallGlow(bd.glow, 20);
      ctx.fillStyle=bd.color; ctx.beginPath(); ctx.arc(200,cy,60,0,6.28); ctx.fill();
      ctx.shadowBlur=0;
      ctx.textAlign="left";
      ctx.fillStyle=bd.color; ctx.font="bold 48px sans-serif"; ctx.fillText(bd.name, 300, cy-85);
      ctx.fillStyle="#e0e0e0"; ctx.font="27px sans-serif";
      ctx.fillText("攻击 "+bd.atk+"   速度 "+bd.speed+"   弹射 "+bd.rebound, 300, cy-30);
      if(bd.effect>0){
        ctx.fillStyle="#b39ddb"; ctx.font="bold 26px sans-serif";
        ctx.fillText("特效：", 300, cy+25);
        ctx.fillStyle="#d1c4e9"; ctx.font="25px sans-serif";
        // 完整效果描述，自动换行
        const desc = EFFECT_DESC[bd.effect]||"";
        wrapText(desc, 300, cy+65, W-300-120, 34);
      }
      ctx.fillStyle="#90caf9"; ctx.font="26px sans-serif";
      ctx.fillText("点击加入球池", 300, cy+140);
    } else {
      const e=EFFECTS[p.id];
      ctx.fillStyle="#66bb6a"; ctx.beginPath();
      ctx.moveTo(200,cy-55); ctx.lineTo(260,cy); ctx.lineTo(200,cy+55); ctx.lineTo(140,cy); ctx.closePath(); ctx.fill();
      ctx.textAlign="left";
      ctx.fillStyle="#a5d6a7"; ctx.font="bold 48px sans-serif"; ctx.fillText(e.name, 300, cy-85);
      ctx.fillStyle="#e0e0e0"; ctx.font="27px sans-serif";
      ctx.fillText(e.word, 300, cy-30);
      ctx.fillStyle="#90caf9"; ctx.font="26px sans-serif";
      ctx.fillText("点击获得永久全局加成", 300, cy+140);
    }
  });
}
// 简易自动换行
function wrapText(text, x, y, maxW, lh){
  let line="", yy=y;
  for(let ch of text){
    const test=line+ch;
    if(ctx.measureText(test).width>maxW && line){
      ctx.fillText(line, x, yy); line=ch; yy+=lh;
    } else line=test;
  }
  if(line){ ctx.fillText(line, x, yy); yy+=lh; }
  return yy;
}
function drawOver(){
  ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#ef5350"; ctx.font="bold 80px sans-serif";
  ctx.fillText("挑战失败", W/2, 750);
  ctx.fillStyle="#fff"; ctx.font="36px sans-serif";
  ctx.fillText("到达第 "+(levelIdx+1)+" 关", W/2, 870);
  ctx.fillText("金钱 "+money+" / 目标 "+LEVELS[levelIdx].target, W/2, 930);
  // 获得经验提示
  ctx.fillStyle="#a5d6a7"; ctx.font="34px sans-serif";
  ctx.fillText("本局获得 "+lastEarnedExp+" 点经验", W/2, 1010);
  // 重新开始按钮
  ctx.fillStyle="#ff7043"; roundRect(W/2-220,1450,440,130,30); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 52px sans-serif";
  ctx.fillText("重新开始", W/2, 1535);
  // 回到主菜单按钮
  ctx.fillStyle="#5c6bc0"; roundRect(W/2-220,1620,440,130,30); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 44px sans-serif";
  ctx.fillText("回到主菜单", W/2, 1705);
}
function drawWin(){
  ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#ffd54f"; ctx.font="bold 80px sans-serif";
  ctx.fillText("🎉 全部通关！", W/2, 750);
  ctx.fillStyle="#fff"; ctx.font="40px sans-serif";
  ctx.fillText("你征服了深海的全部 50 关", W/2, 870);
  ctx.fillStyle="#a5d6a7"; ctx.font="34px sans-serif";
  ctx.fillText("本局获得 50 点经验，已计入天赋", W/2, 950);
  ctx.fillStyle="#ff7043"; roundRect(W/2-220,1500,440,160,30); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 52px sans-serif";
  ctx.fillText("再玩一次", W/2, 1605);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function render(){
  ctx.save();
  if(screenShake>0) ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
  drawBackground();
  if(state===ST.MENU){ drawMenu(); ctx.restore(); return; }
  if(state===ST.TALENT){ drawTalent(); ctx.restore(); return; }
  // 场景区
  ctx.save(); ctx.beginPath(); ctx.rect(0,FIELD_TOP,W,FIELD_BOT-FIELD_TOP); ctx.clip();
  obstacles.forEach(drawObstacle);
  fishes.forEach(drawFish);
  balls.forEach(drawBall);
  drawParticles();
  ctx.restore();
  drawTopUI(); drawBotUI(); drawAim();
  if(state===ST.REWARD) drawReward();
  if(state===ST.OVER) drawOver();
  if(state===ST.WIN) drawWin();
  ctx.restore();
}

/* ============================================================
   主循环
   ============================================================ */
let last = performance.now();
let hiddenAt = 0;
function loop(now){
  let dt = (now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
function onAppHidden(){
  hiddenAt = performance.now();
  releasePointers();
}
function onAppVisible(){
  const now = performance.now();
  let away = 0;
  if(hiddenAt>0){
    away = (now-hiddenAt)/1000;
    if(state===ST.PLAY && settleTimer>0) settleTimer = Math.max(0, settleTimer-away);
    hiddenAt = 0;
  }
  last = now;
  try{ if(AC && AC.state==="suspended") AC.resume(); }catch(e){}
  if(away>0.2 && (state===ST.PLAY || state===ST.AIM)) catchUpSimulation(away);
  checkRoundEnd();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden") onAppHidden();
  else onAppVisible();
});
window.addEventListener("pagehide", onAppHidden);
window.addEventListener("pageshow", onAppVisible);
window.addEventListener("blur", releasePointers);
window.addEventListener("focus", onAppVisible);
window.addEventListener("game:pause", onAppHidden);
window.addEventListener("game:resume", onAppVisible);
loadSave();
requestAnimationFrame(loop);
</script>
